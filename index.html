async function signup(){
 clearError();const email=emailEl().value.trim(),password=passEl().value,username=document.getElementById('uname').value.trim().toLowerCase();
 if(!email||password.length<6||username.length<3)return error('Enter a valid email, password (at least 6 characters), and username (at least 3 characters).');
 try{
  const {data,error:err}=await sb.auth.signUp({email,password,options:{data:{username}}});if(err)throw err;
  if(data.session){me=data.user;await ensureProfile(username);await enter()}
  else error('Account created! Check your email to confirm it, then return here and sign in.');
 }catch(err){error(friendlyError(err))}
}
async function login(){
 clearError();const email=emailEl().value.trim(),password=passEl().value;if(!email||!password)return error('Enter your email and password.');
 try{const {data,error:err}=await sb.auth.signInWithPassword({email,password});if(err)throw err;me=data.user;await ensureProfile(document.getElementById('uname').value.trim().toLowerCase());await enter()}
 catch(err){error(friendlyError(err))}
}
async function ensureProfile(username=''){
 if(!me)throw new Error('Please sign in again.');
 const {data,error:err}=await sb.from('Profile').select('*').eq('id',me.id).maybeSingle();if(err)throw err;
 if(!data){const fallback=(username||me.user_metadata?.username||me.email?.split('@')[0]||'user').toLowerCase().replace(/[^a-z0-9_.]/g,'').slice(0,24)||'user';
  const {error:ins}=await sb.from('Profile').upsert({id:me.id,username:fallback,display_name:fallback,bio:'',avatar_url:null});if(ins)throw ins;
 }
 const {data:profile,error:perr}=await sb.from('Profile').select('*').eq('id',me.id).single();if(perr)throw perr;me={...me,...profile};
}
async function enter(){document.getElementById('auth').style.display='none';document.getElementById('app').style.display='block';await show('home')}
async function logout(){await sb.auth.signOut();me=null;location.reload()}
async function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.navin button').forEach((b,i)=>b.classList.toggle('active',['home','search','create','videos','profile'][i]===id));try{await ({home,search,create,videos:loadVideos,chat:listChats,profile}[id])()}catch(err){alert(friendlyError(err))}}
async function getProfiles(ids){
 const unique=[...new Set((ids||[]).filter(Boolean))];if(!unique.length)return {};
 const {data,error:err}=await sb.from('Profile').select('id,username,display_name,bio,avatar_url').in('id',unique);if(err)throw err;
 return Object.fromEntries((data||[]).map(x=>[x.id,x]));
}
function avatar(p,size=''){return p?.avatar_url?`<img class="av" style="object-fit:cover;${size}" src="${e(p.avatar_url)}">`:`<div class="av" style="${size}">${ini(p?.username||p?.display_name)}</div>`}
async function home(){
 const h=document.getElementById('home');h.innerHTML='<div class="notice">Loading your feed…</div>';
 const now=new Date().toISOString();
 const [postRes,storyRes]=await Promise.all([sb.from('posts').select('*').order('created_at',{ascending:false}),sb.from('stories').select('*').gt('expires_at',now).order('created_at',{ascending:false})]);
 if(postRes.error)throw postRes.error;if(storyRes.error)throw storyRes.error;
 const posts=postRes.data||[],stories=storyRes.data||[];const postIds=posts.map(x=>x.id);
 let likes=[],comments=[];if(postIds.length){const [lr,cr]=await Promise.all([sb.from('likes').select('post_id,user_id').in('post_id',postIds),sb.from('comments').select('*').in('post_id',postIds).order('created_at')]);if(lr.error)throw lr.error;if(cr.error)throw cr.error;likes=lr.data||[];comments=cr.data||[]}
 const ids=[...posts.map(x=>x.user_id),...stories.map(x=>x.user_id),...comments.map(x=>x.user_id)];
 const profiles=await getProfiles(ids);
 currentPosts=posts.map(p=>({...p,profile:profiles[p.user_id],likes:likes.filter(l=>l.post_id===p.id),comments:comments.filter(c=>c.post_id===p.id)}));currentStories=stories.map(s=>({...s,profile:profiles[s.user_id]}));
 h.innerHTML='<div class="homehero"><div><div class="eyebrow">YOUR WORLD, IN MOTION</div><h2>Discover your <span>people.</span></h2><p>Share moments. Find your vibe.</p></div><div class="heroorb">✦</div></div><div class="sectionline"><b>Stories</b><span class="muted">Moments · 24h</span></div><div class="storyrow"><div class="story" onclick="show(\'create\')"><div class="storyadd"><div class="av">＋</div></div>Your story</div>'+currentStories.map(st=>`<div class="story" onclick="viewStory('${st.id}')">${avatar(st.profile)}${e(st.profile?.username||'user')}</div>`).join('')+'</div><div id="feed"></div>';
 const f=document.getElementById('feed');if(!currentPosts.length){f.innerHTML='<div class="notice">No posts yet. Tap ＋ to create your first post.</div>';return}
 currentPosts.forEach(p=>{const u=p.profile||{},liked=p.likes.some(l=>l.user_id===me.id);const c=document.createElement('div');c.className='card';c.innerHTML=`<div class="posthead">${avatar(u)}<div class="grow"><b>${e(u.display_name||u.username||'User')}</b><div class="muted">@${e(u.username||'user')}</div></div>${p.user_id===me.id?`<button onclick="postMenu('${p.id}')">⋮</button>`:''}</div>${p.image_url?`<img class="postimg" src="${e(p.image_url)}">`:''}<div class="postbody">${e(p.content||'')}</div>${p.user_id===me.id?`<div class="postmenu"><button onclick="editPost('${p.id}')">✎ Edit</button><button class="del" onclick="deletePost('${p.id}')">▤ Delete</button><button onclick="sharePost('${p.id}')">↗ Share</button></div>`:''}<div class="actions"><button onclick="like('${p.id}')">${liked?'♥':'♡'}</button><button onclick="comment('${p.id}')">◯</button>${p.user_id!==me.id?`<button onclick="openChat('${p.user_id}')">✉</button>`:''}</div><div class="counts">${p.likes.length} likes · ${p.comments.length} comments</div><div class="commentlist">${p.comments.slice(-3).map(cm=>{const cu=profiles[cm.user_id]||{};return `<div class="comment"><b>@${e(cu.username||'user')}</b> ${e(cm.content)}</div>`}).join('')}</div><form class="commentbar" onsubmit="addComment(event,'${p.id}')"><input id="comment-${p.id}" type="text" maxlength="500" placeholder="Write a comment…" autocomplete="off" aria-label="Write a comment"><button type="submit">Send</button></form>`;f.appendChild(c)});
}
async function loadVideos(){
 const screen=document.getElementById('videos');screen.innerHTML='<h2>Videos</h2><button class="primary" onclick="show(\'create\');setCreateMode(\'video\')">＋ Upload a video</button><div id="videoFeed"><div class="notice">Loading videos…</div></div>';
 const {data,error:err}=await sb.from('videos').select('*').order('created_at',{ascending:false}).limit(50);const feed=document.getElementById('videoFeed');
 if(err){feed.innerHTML=`<div class="notice">${e(friendlyError(err))}<br><small>Create the videos table and Storage bucket in Supabase first.</small></div>`;return}
 const rows=data||[];if(!rows.length){feed.innerHTML='<div class="notice">No videos yet. Be the first to upload one!</div>';return}
 const profiles=await getProfiles(rows.map(v=>v.user_id));feed.innerHTML=rows.map(v=>{const u=profiles[v.user_id]||{};return `<article class="card"><div class="posthead">${avatar(u)}<div class="grow"><b>${e(u.display_name||u.username||'User')}</b><div class="muted">@${e(u.username||'user')} · ${e(fmtDate(v.created_at))}</div></div></div><video src="${e(v.video_url)}" controls playsinline preload="metadata" style="width:100%;max-height:70vh;background:#000;object-fit:contain"></video>${v.caption?`<div class="postbody">${e(v.caption)}</div>`:''}${v.user_id===me.id?`<div class="postmenu"><button class="del" onclick="deleteVideo('${v.id}','${e(v.storage_path||'')}')">Delete video</button></div>`:''}</article>`}).join('');
}
async function postMenu(id){const choice=prompt('Choose an action: edit, delete, or share');if(choice?.toLowerCase()==='edit')await editPost(id);else if(choice?.toLowerCase()==='delete')await deletePost(id);else if(choice?.toLowerCase()==='share')sharePost(id)}
async function editPost(id){const p=currentPosts.find(x=>x.id===id);if(!p||p.user_id!==me.id)return;const content=prompt('Edit your caption',p.content||'');if(content===null)return;const {error:err}=await sb.from('posts').update({content:content.trim()}).eq('id',id).eq('user_id',me.id);if(err)return alert(friendlyError(err));await home()}
async function deletePost(id){if(!confirm('Delete this post?'))return;const {error:err}=await sb.from('posts').delete().eq('id',id).eq('user_id',me.id);if(err)return alert(friendlyError(err));await home()}
async function sharePost(id){const p=currentPosts.find(x=>x.id===id);if(!p)return;const text=`${p.content||'Check out this UltraCam post'}${p.image_url?'\\n'+p.image_url:''}\\n— UltraCam`;try{if(navigator.share)await navigator.share({title:'UltraCam post',text});else if(navigator.clipboard){await navigator.clipboard.writeText(text);alert('Post details copied.')}else prompt('Copy this post text:',text)}catch(err){}}
async function viewStory(id){
 const st=currentStories.find(x=>x.id===id);if(!st)return;
 const w=document.createElement('div');w.className='storyviewer';
 const created=new Date(st.created_at||Date.now());const hours=Math.max(0,Math.floor((Date.now()-created.getTime())/3600000));
 w.innerHTML=`<div class="storystage"><div class="storyprogress"><span></span></div><div class="storytop">${avatar(st.profile)}<div class="grow"><b>${e(st.profile?.display_name||st.profile?.username||'User')}</b><small>${hours}h ago · 24h story</small></div><button class="storyclose" aria-label="Close story">✕</button></div>${st.image_url?`<img class="storymedia" src="${e(st.image_url)}" alt="Story">`:''}${st.content?`<div class="storycaption">${e(st.content)}</div>`:''}</div>`;
 w.querySelector('.storyclose').onclick=()=>w.remove();w.addEventListener('click',ev=>{if(ev.target===w)w.remove()});document.body.appendChild(w);
}
async function like(id){const {data:existing,error:selErr}=await sb.from('likes').select('id').eq('post_id',id).eq('user_id',me.id).maybeSingle();if(selErr)return alert(friendlyError(selErr));const res=existing?await sb.from('likes').delete().eq('id',existing.id):await sb.from('likes').insert({post_id:id,user_id:me.id});if(res.error)return alert(friendlyError(res.error));await home()}
async function addComment(event,id){event.preventDefault();const input=document.getElementById('comment-'+id);const content=input?.value.trim();if(!content)return;const button=input.parentElement.querySelector('button');button.disabled=true;button.textContent='Sending…';try{const {error:err}=await sb.from('comments').insert({post_id:id,user_id:me.id,content});if(err)throw err;await home()}catch(err){alert(friendlyError(err));button.disabled=false;button.textContent='Send'}}
async function comment(id){const input=document.getElementById('comment-'+id);input?.focus()}
function create(){setCreateMode('post');document.getElementById('create').innerHTML='<h2>Create</h2><div class="card" style="padding:15px"><div style="display:flex;gap:8px"><button style="flex:1" onclick="setCreateMode(\'post\')">▣ Post</button><button style="flex:1" onclick="setCreateMode(\'story\')">◉ Story</button></div><div id="createFields"></div></div>';setCreateMode('post')}
function setCreateMode(mode){window.createMode=mode;let f=document.getElementById('createFields');if(!f)return;
 const tabs='<div style="display:flex;gap:7px;margin-bottom:12px"><button style="flex:1" onclick="setCreateMode(\'post\')">▣ Post</button><button style="flex:1" onclick="setCreateMode(\'story\')">◉ Story</button><button style="flex:1" onclick="setCreateMode(\'video\')">▶ Video</button></div>';
 const fields=mode==='story'?'<textarea id="storyText" placeholder="Add something to your story..."></textarea><label class="muted">Choose a story photo</label><input id="cameraPic" type="file" accept="image/*" capture="environment" class="camera-btn"><label class="muted">Or upload from gallery</label><input id="pic" type="file" accept="image/*"><button class="primary" onclick="publishStory()">Share story</button>':mode==='video'?'<textarea id="videoCaption" maxlength="2000" placeholder="Write a caption for your video..."></textarea><label class="muted">Choose a video (MP4, WebM or MOV; max 100 MB)</label><input id="videoFile" type="file" accept="video/*"><button class="primary" id="publishVideoBtn" onclick="publishVideo()">Upload video</button>':'<textarea id="txt" placeholder="Write a caption..."></textarea><label class="muted">Take a photo with your camera</label><input id="cameraPic" type="file" accept="image/*" capture="environment" class="camera-btn"><label class="muted">Or upload a photo from your phone</label><input id="pic" type="file" accept="image/*"><button class="primary" onclick="post()">Share post</button>';
 f.innerHTML=tabs+fields;
}
function selectedFile(){return document.getElementById('cameraPic')?.files?.[0]||document.getElementById('pic')?.files?.[0]||null}
async function uploadImage(file,folder){if(!file)return null;if(!file.type.startsWith('image/'))throw new Error('Please choose an image file.');const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';const path=`${me.id}/${folder}/${crypto.randomUUID()}.${ext}`;const {error:err}=await sb.storage.from('avatars').upload(path,file,{upsert:false,contentType:file.type});if(err)throw err;const {data}=sb.storage.from('avatars').getPublicUrl(path);return data.publicUrl}

async function publishVideo(){
 const file=document.getElementById('videoFile')?.files?.[0],caption=document.getElementById('videoCaption')?.value.trim()||'',btn=document.getElementById('publishVideoBtn');
 if(!file)return alert('Choose a video first.');if(!file.type.startsWith('video/'))return alert('Please choose a video file.');if(file.size>100*1024*1024)return alert('This video is larger than 100 MB. Choose a smaller video.');
 btn.disabled=true;btn.textContent='Uploading…';
 try{const ext=(file.name.split('.').pop()||'mp4').toLowerCase().replace(/[^a-z0-9]/g,'')||'mp4';const storage_path=`${me.id}/${crypto.randomUUID()}.${ext}`;
 const {error:upErr}=await sb.storage.from('videos').upload(storage_path,file,{upsert:false,contentType:file.type||'video/mp4'});if(upErr)throw upErr;
 const {data:urlData}=sb.storage.from('videos').getPublicUrl(storage_path);const {error:dbErr}=await sb.from('videos').insert({user_id:me.id,video_url:urlData.publicUrl,storage_path,caption});
 if(dbErr){await sb.storage.from('videos').remove([storage_path]);throw dbErr;}await show('videos');
 }catch(err){alert(friendlyError(err));btn.disabled=false;btn.textContent='Upload video';}
}
async function deleteVideo(id,path){if(!confirm('Delete this video?'))return;try{const {error:dbErr}=await sb.from('videos').delete().eq('id',id).eq('user_id',me.id);if(dbErr)throw dbErr;if(path){const {error:stErr}=await sb.storage.from('videos').remove([path]);if(stErr)console.warn('Storage cleanup failed:',stErr.message);}await loadVideos();}catch(err){alert(friendlyError(err));}}

async function publishStory(){const content=document.getElementById('storyText')?.value.trim()||'',file=selectedFile();if(!content&&!file)return alert('Write something or choose a photo first.');try{const image_url=await uploadImage(file,'stories');const {error:err}=await sb.from('stories').insert({user_id:me.id,content,image_url,expires_at:new Date(Date.now()+86400000).toISOString()});if(err)throw err;await show('home')}catch(err){alert(friendlyError(err))}}
async function post(){const content=document.getElementById('txt')?.value.trim()||'',file=selectedFile();if(!content&&!file)return alert('Write a caption or choose a photo first.');try{const image_url=await uploadImage(file,'posts');const {error:err}=await sb.from('posts').insert({user_id:me.id,content,image_url});if(err)throw err;await show('home')}catch(err){alert(friendlyError(err))}}
async function search(){const screen=document.getElementById('search');if(!document.getElementById('sq')){screen.innerHTML='<h2>Search people</h2><input id="sq" type="search" placeholder="Search username..." oninput="findUsers()" autocomplete="off"><div id="users"></div>';}await findUsers()}
async function findUsers(){const box=document.getElementById('users'),input=document.getElementById('sq');if(!box||!input)return;const q=input.value.trim();let req=sb.from('Profile').select('id,username,display_name,bio,avatar_url').neq('id',me.id).limit(30);if(q)req=req.or(`username.ilike.%${q}%,display_name.ilike.%${q}%`);const {data,error:err}=await req;if(err){box.innerHTML=`<div class="notice">${e(friendlyError(err))}</div>`;return}const ids=(data||[]).map(x=>x.id);let follows=[];if(ids.length){const r=await sb.from('follows').select('following_id').eq('follower_id',me.id).in('following_id',ids);if(r.error){box.innerHTML=`<div class="notice">${e(friendlyError(r.error))}</div>`;return}follows=r.data||[]}box.innerHTML=(data||[]).map(u=>`<div class="card user">${avatar(u)}<div class="grow"><b>${e(u.display_name||u.username)}</b><div class="muted">@${e(u.username)}</div></div><button onclick="follow('${u.id}')">${follows.some(x=>x.following_id===u.id)?'Following':'Follow'}</button><button onclick="openChat('${u.id}')">Chat</button></div>`).join('')||'<div class="notice">No users found.</div>'}
async function follow(id){const {data:existing,error:selErr}=await sb.from('follows').select('id').eq('follower_id',me.id).eq('following_id',id).maybeSingle();if(selErr)return alert(friendlyError(selErr));const res=existing?await sb.from('follows').delete().eq('id',existing.id):await sb.from('follows').insert({follower_id:me.id,following_id:id});if(res.error)return alert(friendlyError(res.error));await findUsers()}
async function listChats(){const {data,error:err}=await sb.from('messages').select('sender_id,receiver_id,content,created_at').or(`sender_id.eq.${me.id},receiver_id.eq.${me.id}`).order('created_at',{ascending:false});if(err)throw err;const ids=[...new Set((data||[]).map(m=>m.sender_id===me.id?m.receiver_id:m.sender_id))];const profiles=await getProfiles(ids);document.getElementById('chat').innerHTML='<h2>Messages</h2>'+ids.map(id=>{const u=profiles[id]||{};return `<div class="card user" onclick="openChat('${id}')">${avatar(u)}<div><b>${e(u.display_name||u.username||'User')}</b><div class="muted">@${e(u.username||'user')}</div></div></div>`}).join('')||'<div class="notice">No chats yet. Search for a user and tap Chat.</div>'}
async function openChat(id){if(id===me.id)return;chatUser=id;const profiles=await getProfiles([id]);currentChatProfile=profiles[id]||{};document.getElementById('chat').innerHTML=`<div class="user"><button onclick="listChats()">←</button>${avatar(currentChatProfile)}<div><b>${e(currentChatProfile.display_name||currentChatProfile.username||'User')}</b><div class="muted">@${e(currentChatProfile.username||'user')}</div></div></div><div id="msgs" class="messages"></div><div class="chatbar"><input id="mi" placeholder="Message..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">Send</button></div>`;await renderChat()}
async function renderChat(){const x=document.getElementById('msgs');if(!x||!chatUser)return;const {data,error:err}=await sb.from('messages').select('*').or(`and(sender_id.eq.${me.id},receiver_id.eq.${chatUser}),and(sender_id.eq.${chatUser},receiver_id.eq.${me.id})`).order('created_at',{ascending:true});if(err){x.innerHTML=`<div class="notice">${e(friendlyError(err))}</div>`;return}x.innerHTML=(data||[]).map(m=>`<div class="msg ${m.sender_id===me.id?'mine':'other'}">${e(m.content)}</div>`).join('');x.scrollTop=x.scrollHeight}
async function send(){const i=document.getElementById('mi'),content=i?.value.trim();if(!content||!chatUser)return;const {error:err}=await sb.from('messages').insert({sender_id:me.id,receiver_id:chatUser,content});if(err)return alert(friendlyError(err));i.value='';await renderChat()}
async function profile(){
 const {data:prof,error:perr}=await sb.from('Profile').select('*').eq('id',me.id).single();if(perr)throw perr;me={...me,...prof};
 const [pr,fr,fg]=await Promise.all([sb.from('posts').select('id,content,image_url,created_at').eq('user_id',me.id).order('created_at',{ascending:false}),sb.from('follows').select('id',{count:'exact',head:true}).eq('following_id',me.id),sb.from('follows').select('id',{count:'exact',head:true}).eq('follower_id',me.id)]);
 if(pr.error)throw pr.error;if(fr.error)throw fr.error;if(fg.error)throw fg.error;const ps=pr.data||[];
 document.getElementById('profile').innerHTML=`<div class="profile-hero"><div style="display:flex;align-items:center;gap:18px;padding:8px 4px 15px">${avatar(me,'width:88px;height:88px;font-size:25px;flex-shrink:0')}<div style="display:flex;justify-content:space-around;flex:1;text-align:center"><div><b>${ps.length}</b><br><span>posts</span></div><div><b>${fr.count||0}</b><br><span>followers</span></div><div><b>${fg.count||0}</b><br><span>following</span></div></div></div><div style="text-align:left;padding:0 4px"><b>${e(me.display_name||me.username)}</b><div style="margin-top:5px;font-size:14px;white-space:pre-wrap">${e(me.bio||'Add a bio')}</div></div><div style="display:flex;gap:8px;margin:15px 0 8px"><button style="flex:1;background:#efefef;color:#111" onclick="editProfile()">Edit profile</button><button style="flex:1;background:#efefef;color:#111" onclick="alert('Profile sharing will be added in a later update.')">Share profile</button></div></div><div style="padding:13px 16px 5px"><b>Highlights</b><div style="display:flex;gap:18px;margin-top:12px"><div style="text-align:center;font-size:12px"><div style="width:66px;height:66px;border:1px solid #ccc;border-radius:50%;display:grid;place-items:center;font-size:27px">＋</div>New</div><div style="width:66px;height:66px;border-radius:50%;background:#f4f4f4"></div><div style="width:66px;height:66px;border-radius:50%;background:#f4f4f4"></div></div></div><div style="display:flex;justify-content:space-around;border-top:1px solid #eee;border-bottom:1px solid #eee;margin-top:12px;padding:12px;font-size:22px"><span>▦</span><span style="color:#888">▣</span><span style="color:#888">♙</span></div><div class="grid">${ps.filter(p=>p.image_url).map(p=>`<img src="${e(p.image_url)}" onclick="viewPost('${p.id}')">`).join('')}</div>${ps.filter(p=>!p.image_url).map(p=>`<div class="card"><div class="postbody">${e(p.content)}</div></div>`).join('')}${!ps.length?'<div class="notice" style="text-align:center;margin:35px 16px!important">Capture the moment<br><b>Create your first post</b><br><button onclick="show(\'create\')" style="margin-top:12px;background:#efefef">Create post</button></div>':''}`;
}
async function editProfile(){const name=prompt('Display name',me.display_name||me.username);if(name===null)return;const bio=prompt('Bio',me.bio||'');if(bio===null)return;try{const {error:err}=await sb.from('Profile').upsert({id:me.id,username:me.username,display_name:name.trim()||me.username,bio:bio.trim(),avatar_url:me.avatar_url||null});if(err)throw err;await profile()}catch(err){alert(friendlyError(err))}}
function toggleMenu(){const m=document.getElementById('menu');m.style.display=m.style.display==='none'?'block':'none'}
function closeMenu(){document.getElementById('menu').style.display='none'}
function showAbout(){alert('UltraCam\\nA social app connected to Supabase for accounts, posts, likes, comments, follows and messages.')}
async function viewPost(id){const p=currentPosts.find(x=>x.id===id);if(!p)return;alert((p.content||'Post')+'\\n\\n'+p.likes.length+' likes · '+p.comments.length+' comments')}
sb.auth.getSession().then(async({data,error:err})=>{if(err){error(friendlyError(err));return}if(data.session){me=data.session.user;try{await ensureProfile();await enter()}catch(x){error('Could not load your profile: '+friendlyError(x))}}});
